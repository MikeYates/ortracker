<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1e"/>
      <stop offset="100%" style="stop-color:#2c2c2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="url(#bg)"/>

  <!-- Menu bar -->
  <rect x="0" y="0" width="800" height="44" rx="0" fill="#1a1a1c" opacity="0.95"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#333" stroke-width="0.5"/>

  <!-- Menu items -->
  <circle cx="24" cy="22" r="8" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="24" cy="22" r="3" fill="#888"/>
  <text x="64" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="13" fill="#ccc">File</text>
  <text x="108" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="13" fill="#ccc">Edit</text>
  <text x="152" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="13" fill="#ccc">View</text>
  <text x="200" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="13" fill="#ccc">Window</text>
  <text x="264" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="13" fill="#ccc">Help</text>

  <!-- Right side menu items -->
  <text x="610" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="12" fill="#e5e5e5" font-weight="500">Tue Aug 18</text>
  <text x="702" y="29" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="12" fill="#e5e5e5" font-weight="500">7:24 PM</text>

  <!-- ORTracker bar -->
  <rect x="542" y="16" width="44" height="12" rx="6" fill="none" stroke="#444" stroke-width="0.8"/>
  <rect x="542" y="16" width="32" height="12" rx="6" fill="#30d158"/>
  <text x="613" y="29" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#30d158" font-weight="600">$7.10</text>

  <!-- Caption -->
  <text x="400" y="280" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="12" fill="#888" text-anchor="middle">Your OpenRouter balance in the macOS menu bar — live, automatic, always accurate</text>
</svg>