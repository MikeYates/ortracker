<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <ellipse cx="400" cy="200" rx="300" ry="180" fill="url(#bg-glow)" opacity="0.3"/>

  <!-- OpenRouter logo (white, centered) -->
  <g transform="translate(290, 200)" fill="white">
    <!-- Outer ring shape -->
    <path d="M90 0a24.7 24.7 0 1 1 0 49.4L115 92.5c3.1 3.1.9 8.4-3.5 8.4H41.2A41.2 41.2 0 0 1 41.2 0H90zM41.2 35.2a24.7 24.7 0 1 0 0 49.4 24.7 24.7 0 0 0 0-49.4z" transform="scale(0.85)"/>
  </g>

  <!-- Percentage text -->
  <text x="440" y="210" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-1">91%</text>

  <!-- Subtitle -->
  <text x="400" y="275" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="0.3">OpenRouter balance tracker for macOS</text>

  <!-- Install command mockup -->
  <rect x="150" y="310" width="500" height="44" rx="10" fill="rgba(0,0,0,0.25)"/>
  <text x="180" y="338" font-family="SF Mono, Menlo, monospace" font-size="14" fill="rgba(255,255,255,0.9)">
    <tspan>$</tspan>
    <tspan fill="#60a5fa"> curl -fsSL ortracker.yates.id/install.sh | bash</tspan>
  </text>
</svg>